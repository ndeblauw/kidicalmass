<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ride-day playground</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Nunito+Sans:ital,wght@0,400;0,700;0,800&family=Poppins:wght@700;800&display=swap" rel="stylesheet">
<style>
  /* ---- brand tokens (from resources/css/app.css @theme) ---- */
  :root {
    --color-kidical-ink: #281a39;
    --color-kidical-red: #E63A7B;
    --color-kidical-green: #5CB85C;
    --color-kidical-orange: #F0803C;
    --color-kidical-blue: #1d67cd;
    --color-zinc-500: #737373;
    --color-text-body: rgba(40,26,57,0.75);
    --font-sans: 'Nunito Sans', system-ui, sans-serif;
    --font-heading: 'Caprasimo', 'Poppins', system-ui, sans-serif;

    /* UI chrome */
    --ui-bg: #16121d;
    --ui-panel: #1f1a29;
    --ui-line: #322b40;
    --ui-text: #e7e2f0;
    --ui-dim: #9a90ad;
    --ui-accent: #E63A7B;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: system-ui, sans-serif;
    background: var(--ui-bg);
    color: var(--ui-text);
    display: grid;
    grid-template-columns: 340px 1fr;
    height: 100vh;
    overflow: hidden;
  }

  /* ---------------- controls ---------------- */
  .controls {
    border-right: 1px solid var(--ui-line);
    padding: 20px 18px 32px;
    overflow-y: auto;
  }
  .controls h1 { font-size: 15px; margin: 0 0 2px; letter-spacing: -0.01em; }
  .controls .sub { font-size: 12px; color: var(--ui-dim); margin: 0 0 18px; line-height: 1.4; }

  .presets { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 20px; }
  .preset {
    font-size: 11px; padding: 5px 10px; border-radius: 999px;
    background: var(--ui-panel); border: 1px solid var(--ui-line);
    color: var(--ui-text); cursor: pointer;
  }
  .preset:hover { border-color: var(--ui-accent); }
  .preset.active { background: var(--ui-accent); border-color: var(--ui-accent); color: #fff; }

  .group { margin-bottom: 18px; }
  .group > label.key {
    display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--ui-dim); margin-bottom: 8px;
  }
  .seg { display: flex; gap: 4px; }
  .seg button {
    flex: 1; font-size: 12px; padding: 6px 4px; cursor: pointer;
    background: var(--ui-panel); border: 1px solid var(--ui-line); color: var(--ui-text);
    border-radius: 7px;
  }
  .seg button.active { background: var(--ui-accent); border-color: var(--ui-accent); color: #fff; }

  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
  .row label { font-size: 13px; }
  .row .val { font-size: 12px; color: var(--ui-dim); font-variant-numeric: tabular-nums; min-width: 48px; text-align: right; }
  input[type=range] { width: 100%; accent-color: var(--ui-accent); }
  .slider-wrap { margin-bottom: 14px; }
  .slider-wrap .row { margin-bottom: 4px; }

  .toggle { display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 13px; }
  .toggle input { accent-color: var(--ui-accent); width: 15px; height: 15px; }

  /* ---------------- preview ---------------- */
  .stage { display: flex; flex-direction: column; min-width: 0; }
  .stage-bar {
    display: flex; align-items: center; gap: 14px;
    padding: 12px 22px; border-bottom: 1px solid var(--ui-line); font-size: 12px; color: var(--ui-dim);
  }
  .stage-bar .swatch { display: inline-flex; align-items: center; gap: 5px; }
  .stage-bar .dot { width: 10px; height: 10px; border-radius: 3px; }
  .preview-scroll { flex: 1; overflow-y: auto; padding: 40px; background: #efe9df; }
  .page {
    max-width: 620px; margin: 0 auto; background: #fff; border-radius: 18px;
    padding: 40px 44px; box-shadow: 0 18px 40px rgba(40,26,57,0.12);
  }
  .page h2 {
    font-family: var(--font-heading); color: var(--color-kidical-ink);
    font-size: 1.6rem; margin: 0 0 1.5rem; font-weight: 400;
  }

  /* ===== the real component CSS (resources/css/components/ride-day.css + ride-row.css) ===== */
  .chapter-agenda__list { margin: 0; display: flex; flex-direction: column; }

  .ride-day {
    display: grid;
    grid-template-columns: var(--rail-col, 100px) 1fr;
    gap: 0 1.6rem;
    align-items: start;
  }
  .ride-day + .ride-day { margin-top: 1.75rem; padding-top: 1.75rem; }

  .ride-day__cal {
    --ride-accent: var(--color-kidical-red);
    position: relative;
    width: var(--rail-width, 88px);
    margin-top: calc(0.3rem + 3px);
    transform: rotate(var(--ride-day-rot, 0deg));
  }
  .ride-day__rail {
    display: flex; flex-direction: column; width: 100%;
    background: white; border: 1.5px solid var(--color-kidical-ink);
    border-radius: 6px; overflow: hidden;
  }
  .ride-day__star {
    position: absolute; top: 46%; right: -11px; width: 26px; height: 26px;
    transform: translateY(-50%) rotate(-8deg);
    fill: var(--color-kidical-orange); stroke: var(--color-kidical-ink);
    stroke-width: 1.5; stroke-linejoin: round;
  }
  .ride-day__bar { height: 13px; background: var(--ride-accent); }
  .ride-day__body {
    display: flex; flex-direction: column; align-items: center; text-align: center;
    line-height: 1; padding: 7px 7px 9px;
  }
  .ride-day__day {
    font-family: var(--font-sans); font-size: 0.55rem; font-weight: 800;
    text-transform: uppercase; letter-spacing: 0.06em; color: var(--color-zinc-500);
  }
  .ride-day__date {
    font-family: var(--font-sans); font-size: var(--date-size, 1.75rem); font-weight: 800;
    line-height: 0.95; letter-spacing: -0.02em; color: var(--ride-accent);
    margin: 0.1em 0 0.05em;
  }
  .ride-day__month {
    font-family: var(--font-sans); font-size: var(--month-size, 0.68rem); font-weight: 700;
    text-transform: lowercase; color: var(--color-zinc-500);
  }
  .ride-day__rides { display: flex; flex-direction: column; min-width: 0; }

  .ride-row { display: flex; flex-direction: column; row-gap: 0.2rem; padding-block: 0.9rem; text-decoration: none; }
  .ride-row:hover .ride-row__place { color: var(--color-kidical-red); }
  .ride-row__place {
    font-family: var(--font-heading); font-weight: 400; font-size: 1.75rem;
    line-height: 1.15; letter-spacing: -0.01em; color: var(--color-kidical-blue);
    transition: color 0.18s;
  }
  .ride-row__meta {
    display: flex; align-items: baseline; flex-wrap: wrap; gap: 0.4rem;
    font-family: var(--font-sans); font-size: 1.25rem; color: var(--color-text-body);
  }
  .ride-row__weekday { font-weight: 700; text-transform: capitalize; }
  .ride-row__connector { color: color-mix(in oklab, var(--color-text-body), transparent 25%); }
  .ride-row__time { font-weight: 700; }
  .ride-row__at { color: color-mix(in oklab, var(--color-text-body), transparent 25%); }

  /* prompt */
  .prompt-wrap { border-top: 1px solid var(--ui-line); padding: 16px 22px; background: var(--ui-panel); }
  .prompt-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .prompt-head span { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ui-dim); }
  .copy { font-size: 12px; padding: 5px 12px; border-radius: 7px; cursor: pointer;
    background: var(--ui-accent); border: none; color: #fff; }
  .prompt { font-size: 12.5px; line-height: 1.5; color: var(--ui-text); white-space: pre-wrap;
    font-family: ui-monospace, 'SF Mono', monospace; max-height: 150px; overflow-y: auto; }
</style>
</head>
<body>

<aside class="controls">
  <h1>Ride-day playground</h1>
  <p class="sub">Stem het agenda-rijtje af. Tweak de datumblok en de meta-regel, en zie meteen hoe een stapel ritdagen leest.</p>

  <div class="presets" id="presets"></div>

  <div class="group">
    <label class="key">Weekdag (maandag)</label>
    <div class="seg" id="weekdayPlacement">
      <button data-v="cal">In datumblok</button>
      <button data-v="meta">In meta-regel</button>
      <button data-v="none">Verbergen</button>
    </div>
  </div>

  <div class="group" id="connectorGroup">
    <label class="toggle"><input type="checkbox" id="connector"> Voegwoord "om" (Maandag <em>om</em> 14u)</label>
  </div>

  <div class="group">
    <label class="key">Maand</label>
    <div class="seg" id="monthFormat">
      <button data-v="full">Voluit (juni)</button>
      <button data-v="abbr">3 letters (jun)</button>
    </div>
  </div>

  <div class="group slider-wrap">
    <div class="row"><label>Datum-grootte</label><span class="val" id="dateSizeVal"></span></div>
    <input type="range" id="dateSize" min="1.3" max="3.4" step="0.05">
  </div>

  <div class="group slider-wrap">
    <div class="row"><label>Maand-grootte</label><span class="val" id="monthSizeVal"></span></div>
    <input type="range" id="monthSize" min="0.5" max="1.1" step="0.01">
  </div>

  <div class="group slider-wrap">
    <div class="row"><label>Breedte datumblok</label><span class="val" id="railWidthVal"></span></div>
    <input type="range" id="railWidth" min="56" max="110" step="1">
  </div>

  <div class="group">
    <label class="toggle"><input type="checkbox" id="tilt"> Speelse tilt (rotatie per dag)</label>
  </div>
</aside>

<main class="stage">
  <div class="stage-bar">
    <span>Accentkleur per type:</span>
    <span class="swatch"><span class="dot" style="background:#E63A7B"></span> rit</span>
    <span class="swatch"><span class="dot" style="background:#5CB85C"></span> workshop</span>
    <span class="swatch"><span class="dot" style="background:#1d67cd"></span> vergadering</span>
    <span class="swatch"><span class="dot" style="background:#F0803C"></span> andere</span>
  </div>
  <div class="preview-scroll">
    <div class="page">
      <h2>Op de agenda</h2>
      <div class="chapter-agenda__list" id="list"></div>
    </div>
  </div>
  <div class="prompt-wrap">
    <div class="prompt-head">
      <span>Prompt</span>
      <button class="copy" id="copy">Kopieer prompt</button>
    </div>
    <div class="prompt" id="prompt"></div>
  </div>
</main>

<script>
// ---- sample agenda data (Dutch, Belgian) ----
const STAR = '<svg class="ride-day__star" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1.6l3.09 6.26 6.91 1-5 4.87 1.18 6.88L12 17.27l-6.18 3.25L7 13.64l-5-4.87 6.91-1z"/></svg>';
const RIDES = [
  { weekday:'zondag',    wd_ab:'zo', day:14, month:'juni',      m_ab:'jun', time:'14u',   accent:'red',    title:'Fietsparade',                venue:'Sint-Pietersplein', grande:true,  rot:-3 },
  { weekday:'maandag',   wd_ab:'ma', day:22, month:'juni',      m_ab:'jun', time:'19u30', accent:'green',  title:'Workshop fietsonderhoud',    venue:'Buurthuis Macharius', grande:false, rot:2 },
  { weekday:'woensdag',  wd_ab:'wo', day:1,  month:'juli',      m_ab:'jul', time:'20u',   accent:'blue',   title:'Bestuursvergadering',        venue:'Café De Vooruit',     grande:false, rot:-2 },
  { weekday:'zaterdag',  wd_ab:'za', day:11, month:'juli',      m_ab:'jul', time:'10u',   accent:'red',    title:'Zomerrit langs de Leie',     venue:'Citadelpark',         grande:false, rot:4 },
  { weekday:'zondag',    wd_ab:'zo', day:19, month:'juli',      m_ab:'jul', time:'11u',   accent:'orange', title:'Picknickrit',                venue:'Blaarmeersen',        grande:false, rot:-1 },
  { weekday:'zaterdag',  wd_ab:'za', day:5,  month:'september', m_ab:'sep', time:'14u',   accent:'red',    title:'Fietsparade',                venue:'Gentbrugse Meersen',  grande:true,  rot:3 },
];
const ACCENT = { red:'var(--color-kidical-red)', green:'var(--color-kidical-green)', blue:'var(--color-kidical-blue)', orange:'var(--color-kidical-orange)' };

const DEFAULTS = { weekdayPlacement:'cal', connector:false, monthFormat:'full', dateSize:1.75, monthSize:0.68, railWidth:88, tilt:false };
const PRESETS = {
  'Huidig':          { ...DEFAULTS },
  "Frederiks idee":  { weekdayPlacement:'meta', connector:true,  monthFormat:'abbr', dateSize:2.5, monthSize:0.85, railWidth:80, tilt:false },
  'Compact':         { weekdayPlacement:'meta', connector:false, monthFormat:'abbr', dateSize:2.1, monthSize:0.78, railWidth:66, tilt:false },
  'Groot getal':     { weekdayPlacement:'meta', connector:true,  monthFormat:'abbr', dateSize:3.1, monthSize:0.95, railWidth:88, tilt:false },
};

const state = { ...DEFAULTS };

function cap(s){ return s.charAt(0).toUpperCase() + s.slice(1); }

function renderPreview() {
  const list = document.getElementById('list');
  list.innerHTML = RIDES.map(r => {
    const accent = ACCENT[r.accent];
    const rot = state.tilt ? r.rot : 0;
    const monthText = state.monthFormat === 'abbr' ? r.m_ab : r.month;

    // calendar block body
    let body = '';
    if (state.weekdayPlacement === 'cal') {
      body += `<span class="ride-day__day">${r.weekday}</span>`;
    }
    body += `<span class="ride-day__date">${r.day}</span>`;
    body += `<span class="ride-day__month">${monthText}</span>`;

    // meta line
    let meta = '';
    if (state.weekdayPlacement === 'meta') {
      meta += `<span class="ride-day__weekday">${cap(r.weekday)}</span>`;
      if (state.connector) meta += `<span class="ride-row__connector">om</span>`;
    }
    meta += `<time class="ride-row__time">${r.time}</time>`;
    meta += `<span><span class="ride-row__at" aria-hidden="true">@</span> ${r.venue}</span>`;

    return `
      <section class="ride-day" style="--rail-col:${state.railWidth + 12}px;">
        <div class="ride-day__cal" style="--ride-accent:${accent}; --ride-day-rot:${rot}deg; --rail-width:${state.railWidth}px; --date-size:${state.dateSize}rem; --month-size:${state.monthSize}rem;">
          <div class="ride-day__rail">
            <span class="ride-day__bar"></span>
            <span class="ride-day__body">${body}</span>
          </div>
          ${r.grande ? STAR : ''}
        </div>
        <div class="ride-day__rides">
          <a class="ride-row" href="#">
            <span class="ride-row__place" style="color:${ r.accent==='red' ? 'var(--color-kidical-blue)' : 'var(--color-kidical-blue)' }">${r.title}</span>
            <span class="ride-row__meta">${meta}</span>
          </a>
        </div>
      </section>`;
  }).join('');
}

function updatePrompt() {
  const parts = [];
  if (state.weekdayPlacement === 'meta') {
    parts.push(`move the weekday out of the calendar lockup and into the ride-row meta line, rendered before the time${state.connector ? ` with the connector word "om" (e.g. "Maandag om 14u @ venue")` : ` (e.g. "Maandag 14u @ venue")`} and capitalized`);
  } else if (state.weekdayPlacement === 'none') {
    parts.push(`drop the weekday entirely from the calendar lockup`);
  }
  if (state.monthFormat === 'abbr') {
    parts.push(`show a 3-letter month abbreviation (jun, jul, sep) instead of the full month name`);
  }
  if (Math.abs(state.dateSize - DEFAULTS.dateSize) > 0.001) {
    const word = state.dateSize >= 2.8 ? 'much larger' : state.dateSize >= 2.1 ? 'noticeably larger' : 'slightly larger';
    parts.push(`bump the day number (.ride-day__date) to ${state.dateSize.toFixed(2)}rem (${word})`);
  }
  if (Math.abs(state.monthSize - DEFAULTS.monthSize) > 0.001) {
    parts.push(`set the month label (.ride-day__month) to ${state.monthSize.toFixed(2)}rem`);
  }
  if (state.railWidth !== DEFAULTS.railWidth) {
    parts.push(`set the calendar lockup width (.ride-day__cal) to ${state.railWidth}px (grid column ${state.railWidth + 12}px)`);
  }
  if (state.tilt !== DEFAULTS.tilt) {
    parts.push(state.tilt ? `keep the per-day playful tilt rotation` : `remove the per-day tilt rotation (keep all lockups upright)`);
  }

  let text;
  if (parts.length === 0) {
    text = 'Ride-day component is at its current defaults — adjust the controls to generate a change.';
  } else {
    text = 'Refine the ride-day agenda component (resources/views/components/ride-day.blade.php + ride-row.blade.php, styled in resources/css/components/ride-day.css + ride-row.css; date strings come from App\\Support\\RideDate::rail()).\n\nChanges:\n- ' + parts.join(';\n- ') + '.';
    if (state.weekdayPlacement === 'meta') {
      text += '\n\nNote: RideDate::rail() currently returns the full weekday in `day`; expose it (capitalized) to ride-row.blade.php for the meta line, and stop rendering .ride-day__day in the lockup.';
    }
    if (state.monthFormat === 'abbr') {
      text += '\n\nNote: add a 3-letter month to RideDate::rail() via isoFormat(\'MMM\') (trim the trailing period) and render it in .ride-day__month.';
    }
  }
  document.getElementById('prompt').textContent = text;
}

function updateAll(){ renderPreview(); updatePrompt(); syncControls(); }

// ---- control wiring ----
function syncControls() {
  document.querySelectorAll('#weekdayPlacement button').forEach(b => b.classList.toggle('active', b.dataset.v === state.weekdayPlacement));
  document.querySelectorAll('#monthFormat button').forEach(b => b.classList.toggle('active', b.dataset.v === state.monthFormat));
  document.getElementById('connector').checked = state.connector;
  document.getElementById('tilt').checked = state.tilt;
  document.getElementById('dateSize').value = state.dateSize;
  document.getElementById('monthSize').value = state.monthSize;
  document.getElementById('railWidth').value = state.railWidth;
  document.getElementById('dateSizeVal').textContent = state.dateSize.toFixed(2) + 'rem';
  document.getElementById('monthSizeVal').textContent = state.monthSize.toFixed(2) + 'rem';
  document.getElementById('railWidthVal').textContent = state.railWidth + 'px';
  document.getElementById('connectorGroup').style.opacity = state.weekdayPlacement === 'meta' ? '1' : '0.4';
  document.getElementById('connector').disabled = state.weekdayPlacement !== 'meta';
  // active preset
  document.querySelectorAll('.preset').forEach(p => {
    const ps = PRESETS[p.dataset.name];
    p.classList.toggle('active', JSON.stringify(ps) === JSON.stringify(state));
  });
}

document.querySelectorAll('#weekdayPlacement button').forEach(b => b.onclick = () => { state.weekdayPlacement = b.dataset.v; updateAll(); });
document.querySelectorAll('#monthFormat button').forEach(b => b.onclick = () => { state.monthFormat = b.dataset.v; updateAll(); });
document.getElementById('connector').onchange = e => { state.connector = e.target.checked; updateAll(); };
document.getElementById('tilt').onchange = e => { state.tilt = e.target.checked; updateAll(); };
document.getElementById('dateSize').oninput = e => { state.dateSize = parseFloat(e.target.value); updateAll(); };
document.getElementById('monthSize').oninput = e => { state.monthSize = parseFloat(e.target.value); updateAll(); };
document.getElementById('railWidth').oninput = e => { state.railWidth = parseInt(e.target.value); updateAll(); };

// presets
const presetsEl = document.getElementById('presets');
Object.keys(PRESETS).forEach(name => {
  const b = document.createElement('button');
  b.className = 'preset'; b.textContent = name; b.dataset.name = name;
  b.onclick = () => { Object.assign(state, JSON.parse(JSON.stringify(PRESETS[name]))); updateAll(); };
  presetsEl.appendChild(b);
});

document.getElementById('copy').onclick = () => {
  navigator.clipboard.writeText(document.getElementById('prompt').textContent).then(() => {
    const btn = document.getElementById('copy'); const t = btn.textContent;
    btn.textContent = 'Gekopieerd!'; setTimeout(() => btn.textContent = t, 1200);
  });
};

updateAll();
</script>
</body>
</html>
