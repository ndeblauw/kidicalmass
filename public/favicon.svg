<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Daisy petals (12 petals) -->
  <g transform="translate(50, 50)">
    <ellipse cx="0" cy="-34" rx="9" ry="18" fill="#FDB913" transform="rotate(0)" />
    <ellipse cx="0" cy="-34" rx="9" ry="18" fill="#FDB913" transform="rotate(30)" />
    <ellipse cx="0" cy="-34" rx="9" ry="18" fill="#FDB913" transform="rotate(60)" />
    <ellipse cx="0" cy="-34" rx="9" ry="18" fill="#FDB913" transform="rotate(90)" />
    <ellipse cx="0" cy="-34" rx="9" ry="18" fill="#FDB913" transform="rotate(120)" />
    <ellipse cx="0" cy="-34" rx="9" ry="18" fill="#FDB913" transform="rotate(150)" />
    <ellipse cx="0" cy="-34" rx="9" ry="18" fill="#FDB913" transform="rotate(180)" />
    <ellipse cx="0" cy="-34" rx="9" ry="18" fill="#FDB913" transform="rotate(210)" />
    <ellipse cx="0" cy="-34" rx="9" ry="18" fill="#FDB913" transform="rotate(240)" />
    <ellipse cx="0" cy="-34" rx="9" ry="18" fill="#FDB913" transform="rotate(270)" />
    <ellipse cx="0" cy="-34" rx="9" ry="18" fill="#FDB913" transform="rotate(300)" />
    <ellipse cx="0" cy="-34" rx="9" ry="18" fill="#FDB913" transform="rotate(330)" />
    <!-- Center -->
    <circle cx="0" cy="0" r="20" fill="white" />
    <circle cx="0" cy="0" r="17" fill="#FFF9E6" />
    <!-- Eyes -->
    <circle cx="-5" cy="-4" r="2.5" fill="#333" />
    <circle cx="5" cy="-4" r="2.5" fill="#333" />
    <!-- Smile -->
    <path d="M -6 3 Q 0 9 6 3" stroke="#333" stroke-width="2" fill="none" stroke-linecap="round" />
  </g>
</svg>

