<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 150" width="320" height="150">
  <defs>
    <style>
      .logo-text {
        font-family: 'Fredoka One', 'Arial Rounded MT Bold', 'Nunito', Arial, sans-serif;
        font-weight: 900;
        fill: #1d67cd;
      }
    </style>
  </defs>

  <!-- Daisy petals (12 petals) -->
  <g transform="translate(72, 75)">
    <ellipse cx="0" cy="-42" rx="13" ry="24" fill="#f9d924" transform="rotate(0)" />
    <ellipse cx="0" cy="-42" rx="13" ry="24" fill="#f9d924" transform="rotate(30)" />
    <ellipse cx="0" cy="-42" rx="13" ry="24" fill="#f9d924" transform="rotate(60)" />
    <ellipse cx="0" cy="-42" rx="13" ry="24" fill="#f9d924" transform="rotate(90)" />
    <ellipse cx="0" cy="-42" rx="13" ry="24" fill="#f9d924" transform="rotate(120)" />
    <ellipse cx="0" cy="-42" rx="13" ry="24" fill="#f9d924" transform="rotate(150)" />
    <ellipse cx="0" cy="-42" rx="13" ry="24" fill="#f9d924" transform="rotate(180)" />
    <ellipse cx="0" cy="-42" rx="13" ry="24" fill="#f9d924" transform="rotate(210)" />
    <ellipse cx="0" cy="-42" rx="13" ry="24" fill="#f9d924" transform="rotate(240)" />
    <ellipse cx="0" cy="-42" rx="13" ry="24" fill="#f9d924" transform="rotate(270)" />
    <ellipse cx="0" cy="-42" rx="13" ry="24" fill="#f9d924" transform="rotate(300)" />
    <ellipse cx="0" cy="-42" rx="13" ry="24" fill="#f9d924" transform="rotate(330)" />

    <!-- Center circle -->
    <circle cx="0" cy="0" r="26" fill="white" />
    <circle cx="0" cy="0" r="23" fill="#FFF9E6" />

    <!-- Left eye -->
    <circle cx="-8" cy="-6" r="3.5" fill="#333" />
    <circle cx="-7" cy="-7" r="1.2" fill="white" />

    <!-- Right eye -->
    <circle cx="8" cy="-6" r="3.5" fill="#333" />
    <circle cx="9" cy="-7" r="1.2" fill="white" />

    <!-- Smile -->
    <path d="M -9 4 Q 0 14 9 4" stroke="#333" stroke-width="2.5" fill="none" stroke-linecap="round" />
  </g>

  <!-- KIDICAL text -->
  <text x="138" y="72" class="logo-text" font-size="54" letter-spacing="-1">KIDICAL</text>

  <!-- MASS text -->
  <text x="157" y="130" class="logo-text" font-size="65" letter-spacing="-1">MASS</text>
</svg>
